<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Calculadora de Emissão de CO2</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header>
    <button id="theme-toggle" class="theme-toggle" aria-label="Alternar tema">
      🌙
    </button>

    <h1>Calculadora de Emissão de CO2</h1>
  </header>

  <main id="app-layout" class="initial-layout">
    <div class="left-column">
      <section class="form-panel" aria-labelledby="form-title">
        <h2 id="form-title">Informações da rota</h2>

        <form id="carbon-form">
          <fieldset>
            <legend>Preencha os dados abaixo</legend>

            <div>
              <label for="origin">Local de partida</label>
              <input
                type="text"
                id="origin"
                name="origin"
                list="location-suggestions"
                placeholder="Ex: Praça Sete, Belo Horizonte, MG, Brasil"
                required
              />
            </div>

            <div>
              <label for="destination">Local de chegada</label>
              <input
                type="text"
                id="destination"
                name="destination"
                list="location-suggestions"
                placeholder="Ex: Praça da Liberdade, Belo Horizonte, MG, Brasil"
                required
              />
            </div>

            <datalist id="location-suggestions">
              <option value="Praça Sete de Setembro, Belo Horizonte, MG, Brasil"></option>
              <option value="Praça da Liberdade, Belo Horizonte, MG, Brasil"></option>
              <option value="Avenida Paulista, São Paulo, SP, Brasil"></option>
              <option value="Parque Ibirapuera, São Paulo, SP, Brasil"></option>
              <option value="Copacabana, Rio de Janeiro, RJ, Brasil"></option>
            </datalist>

            <div class="transport-container">
              <label>Meio de transporte</label>

              <div class="transport-options">
                <label class="transport-card">
                  <input type="radio" name="transport" value="andando" required />
                  <span>🚶 Andando</span>
                </label>

                <label class="transport-card">
                  <input type="radio" name="transport" value="bicicleta" />
                  <span>🚲 Bicicleta</span>
                </label>

                <label class="transport-card">
                  <input type="radio" name="transport" value="moto" />
                  <span>🏍️ Moto</span>
                </label>

                <label class="transport-card">
                  <input type="radio" name="transport" value="carro" />
                  <span>🚗 Carro</span>
                </label>

                <label class="transport-card">
                  <input type="radio" name="transport" value="onibus" />
                  <span>🚌 Ônibus</span>
                </label>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-primary">
                Calcular emissão
              </button>

              <button type="button" id="clear-button" class="btn-secondary">
                Limpar campos
              </button>
            </div>
          </fieldset>
        </form>
      </section>
    </div>

    <aside id="result-panel" class="result-panel hidden">
      <section id="loading-section" class="hidden">
        <p class="result-text">Calculando rota real...</p>
      </section>

      <section id="result-section" class="hidden">
        <h2>Resultados da Emissão</h2>
        <div id="result" class="result-text"></div>
      </section>

      <section id="comparison-section" class="hidden">
        <h2>Comparativo entre Meios de Transporte</h2>
        <div id="comparison" class="comparison-list"></div>
      </section>

      <section id="carbon-credit-section" class="hidden">
        <h2>Crédito de carbono</h2>

        <div class="carbon-credit-grid">
          <div class="credit-card">
            <span class="credit-label">🌳 Créditos necessários</span>
            <div id="carbon-credit-value"></div>
            <small>crédito(s) de carbono</small>
          </div>

          <div class="credit-card">
            <span class="credit-label">💰 Custo estimado</span>
            <div id="carbon-credit-cost"></div>
            <small>valor aproximado</small>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <footer>
    <p class="footer-main">
      Desenvolvido com <strong>AMOR</strong>
    </p>

    <div class="footer-heart">♡</div>

    <p class="footer-brand">DIO</p>
    <p class="footer-brand">ACG</p>
  </footer>

  <script src="./js/routes-data.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/calculator.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
